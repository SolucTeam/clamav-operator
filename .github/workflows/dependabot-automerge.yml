# =============================================================================
# Auto-merge Dependabot PRs
# =============================================================================
# Automatically merges Dependabot PRs when:
#   1. All tests pass successfully
#   2. The update is minor or patch (not major)
#   3. Security checks pass
#
# Major updates always require a manual review
# =============================================================================

name: Dependabot Auto-merge

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write

jobs:
  # ===========================================================================
  # Job 1 - Check whether this is an eligible Dependabot PR
  # ===========================================================================
  check-dependabot:
    name: Check Dependabot PR
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]'
    outputs:
      is_eligible: ${{ steps.check.outputs.is_eligible }}
      update_type: ${{ steps.metadata.outputs.update-type }}
    steps:
      - name: Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"

      - name: Check if eligible for auto-merge
        id: check
        run: |
          UPDATE_TYPE="${{ steps.metadata.outputs.update-type }}"
          
          echo "Update type: $UPDATE_TYPE"
          
          # Auto-merge only for patch and minor updates
          if [[ "$UPDATE_TYPE" == "version-update:semver-patch" ]] || \
             [[ "$UPDATE_TYPE" == "version-update:semver-minor" ]]; then
            echo "✅ Eligible for auto-merge (update type: $UPDATE_TYPE)"
            echo "is_eligible=true" >> $GITHUB_OUTPUT
          else
            echo "❌ Not eligible for auto-merge (update type: $UPDATE_TYPE)"
            echo "ℹ️  Major updates require manual review"
            echo "is_eligible=false" >> $GITHUB_OUTPUT
          fi

  # ===========================================================================
  # Job 2 - Wait for all checks to pass
  # ===========================================================================
  wait-for-checks:
    name: Wait for Checks
    runs-on: ubuntu-latest
    needs: check-dependabot
    if: needs.check-dependabot.outputs.is_eligible == 'true'
    steps:
      - name: Wait for required checks
        uses: actions/github-script@v8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const requiredChecks = [
              'Lint & Test',
              'Build: clamav-operator',
              'Build: clamav-node-scanner'
            ];
            
            const maxAttempts = 60; // 30 minutes max (30 secondes * 60)
            let attempt = 0;
            
            while (attempt < maxAttempts) {
              attempt++;
              
              console.log(`Attempt ${attempt}/${maxAttempts}: Checking status...`);
              
              // Fetch check runs for this commit
              const { data: checkRuns } = await github.rest.checks.listForRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: '${{ github.event.pull_request.head.sha }}'
              });
              
              // Check the status of required checks
              const checkStatuses = {};
              for (const check of checkRuns.check_runs) {
                if (requiredChecks.includes(check.name)) {
                  checkStatuses[check.name] = {
                    status: check.status,
                    conclusion: check.conclusion
                  };
                }
              }
              
              // Display current state
              console.log('Check statuses:', JSON.stringify(checkStatuses, null, 2));
              
              // Check whether all required checks have completed
              const allCompleted = requiredChecks.every(name => 
                checkStatuses[name] && checkStatuses[name].status === 'completed'
              );
              
              if (!allCompleted) {
                console.log('Some checks are still running, waiting 30 seconds...');
                await new Promise(resolve => setTimeout(resolve, 30000));
                continue;
              }
              
              // Check whether all required checks succeeded
              const allSuccess = requiredChecks.every(name =>
                checkStatuses[name] && checkStatuses[name].conclusion === 'success'
              );
              
              if (allSuccess) {
                console.log('✅ All required checks passed!');
                return;
              }
              
              // Some checks failed
              const failedChecks = requiredChecks.filter(name =>
                checkStatuses[name] && checkStatuses[name].conclusion !== 'success'
              );
              
              console.log('❌ Some checks failed:', failedChecks);
              throw new Error(`Required checks failed: ${failedChecks.join(', ')}`);
            }
            
            throw new Error('Timeout waiting for checks to complete');

  # ===========================================================================
  # Job 3 - Approuver et merger la PR
  # ===========================================================================
  auto-merge:
    name: Auto-merge PR
    runs-on: ubuntu-latest
    needs: [check-dependabot, wait-for-checks]
    if: needs.check-dependabot.outputs.is_eligible == 'true'
    steps:
      - name: Enable auto-merge
        run: |
          gh pr merge "$PR_URL" --auto --squash --delete-branch
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Comment on PR
        uses: actions/github-script@v8
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: '🤖 **Auto-merge enabled**\n\n' +
                    'This PR will be automatically merged once all checks are green.\n\n' +
                    '**Update type:** `${{ needs.check-dependabot.outputs.update_type }}`\n' +
                    '**Strategy:** Squash merge with branch deletion\n\n' +
                    '⚠️ _Note: GitHub Actions cannot automatically approve PRs._\n' +
                    '_If a manual approval is required by branch protections, please approve manually._'
            });

  # ===========================================================================
  # Job 4 - Notify when the PR is not eligible for auto-merge
  # ===========================================================================
  notify-manual-review:
    name: Notify Manual Review Required
    runs-on: ubuntu-latest
    needs: check-dependabot
    if: |
      github.actor == 'dependabot[bot]' && 
      needs.check-dependabot.outputs.is_eligible == 'false'
    steps:
      - name: Comment on PR
        uses: actions/github-script@v8
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: '⚠️ **Manual review required**\n\n' +
                    'This PR contains a major update and requires a manual review.\n\n' +
                    '**Update type:** `${{ needs.check-dependabot.outputs.update_type }}`\n\n' +
                    '**Required actions:**\n' +
                    '1. ✅ Check for breaking changes in the changelog\n' +
                    '2. ✅ Test locally if necessary\n' +
                    '3. ✅ Verify that all tests pass\n' +
                    '4. ✅ Approve and merge manually'
            });

      - name: Add label
        uses: actions/github-script@v8
        with:
          script: |
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              labels: ['needs-review', 'major-update']
            });