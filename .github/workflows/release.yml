# =============================================================================
# Auto Release with Semantic Versioning
# =============================================================================
# Automatically creates GitHub releases based on Conventional Commits
#
# Commit format:
#   feat: new feature      → MINOR bump (1.0.0 → 1.1.0)
#   fix: bug fix           → PATCH bump (1.0.0 → 1.0.1)
#   BREAKING CHANGE:       → MAJOR bump (1.0.0 → 2.0.0)
#
# Triggers:
#   - Push to main with feat/fix commits        → auto-calculates next semver
#   - Push a tag v* or V* (e.g. git push v1.2.3) → uses the tag version directly
#   - Manual via workflow_dispatch
# =============================================================================

name: Auto Release

on:
  push:
    branches:
      - main
    # Tags v*/V* trigger a release using the tag version directly.
    # paths-ignore is intentionally absent here: tag pushes must always fire,
    # and branch pushes are already gated by the should_release commit check.
    tags:
      - 'v[0-9]*'
      - 'V[0-9]*'
  workflow_dispatch:
    inputs:
      version_bump:
        description: 'Version bump type'
        required: true
        default: 'auto'
        type: choice
        options:
          - auto
          - major
          - minor
          - patch

permissions:
  contents: write
  pull-requests: write
  packages: write
  actions: write
  security-events: write
  id-token: write # Required by docker-build.yml called via workflow_call (cosign signing)

jobs:
  # ===========================================================================
  # Job 1 - Analyse commits and determine the version
  # ===========================================================================
  analyze:
    name: Analyze Commits
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.check.outputs.should_release }}
      version: ${{ steps.semver.outputs.version }}
      changelog: ${{ steps.changelog.outputs.changelog }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Check if should release
        id: check
        run: |
          # ── Tag push: always release, version comes from the tag ──────────
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "should_release=true" >> $GITHUB_OUTPUT
            echo "🏷️  Triggered by tag push: ${{ github.ref_name }}"
            exit 0
          fi

          # ── Branch push: check for releasable commits ─────────────────────
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")

          if [ -z "$LAST_TAG" ]; then
            echo "should_release=true" >> $GITHUB_OUTPUT
            echo "📦 First release - will create v0.1.0"
            exit 0
          fi

          COMMITS=$(git log $LAST_TAG..HEAD --oneline 2>/dev/null || git log --oneline)

          if echo "$COMMITS" | grep -qE '^[a-f0-9]+ (feat|fix|perf|refactor)(\(.+\))?!?:'; then
            echo "should_release=true" >> $GITHUB_OUTPUT
            echo "✅ Found releasable commits since $LAST_TAG"
          else
            echo "should_release=false" >> $GITHUB_OUTPUT
            echo "ℹ️  No releasable commits found since $LAST_TAG"
          fi

      - name: Calculate next version
        id: semver
        if: steps.check.outputs.should_release == 'true'
        run: |
          # ── Tag push: extract version directly from the tag ───────────────
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG="${{ github.ref_name }}"
            VERSION="${TAG#v}"   # strip leading 'v'
            VERSION="${VERSION#V}" # strip leading 'V'
            echo "version=$VERSION" >> $GITHUB_OUTPUT
            echo "🏷️  Using version from tag: v$VERSION"
            exit 0
          fi

          # ── Branch push / manual: calculate from conventional commits ─────
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")

          if [ -z "$LAST_TAG" ]; then
            echo "📦 First release - starting with v0.1.0"
            VERSION="0.0.0"
          else
            VERSION=${LAST_TAG#v}
            echo "📦 Current version: $LAST_TAG"
          fi

          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"

          if [ -z "$LAST_TAG" ]; then
            COMMITS=$(git log --format=%s)
          else
            COMMITS=$(git log $LAST_TAG..HEAD --format=%s 2>/dev/null || git log --format=%s)
          fi

          BUMP_TYPE="${{ github.event.inputs.version_bump }}"

          if [ "$BUMP_TYPE" = "auto" ] || [ -z "$BUMP_TYPE" ]; then
            if echo "$COMMITS" | grep -qE '^(feat|fix|perf|refactor).*!:|^BREAKING CHANGE:'; then
              BUMP_TYPE="major"
            elif echo "$COMMITS" | grep -qE '^feat(\(.+\))?:'; then
              BUMP_TYPE="minor"
            elif echo "$COMMITS" | grep -qE '^fix(\(.+\))?:'; then
              BUMP_TYPE="patch"
            else
              BUMP_TYPE="patch"
            fi
          fi

          case "$BUMP_TYPE" in
            major)
              MAJOR=$((MAJOR + 1))
              MINOR=0
              PATCH=0
              ;;
            minor)
              MINOR=$((MINOR + 1))
              PATCH=0
              ;;
            patch)
              PATCH=$((PATCH + 1))
              ;;
          esac

          NEW_VERSION="$MAJOR.$MINOR.$PATCH"
          echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "✨ Next version will be: v$NEW_VERSION (bump: $BUMP_TYPE)"

      - name: Generate changelog
        id: changelog
        if: steps.check.outputs.should_release == 'true'
        run: |
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          
          if [ -z "$LAST_TAG" ]; then
            RANGE="HEAD"
            echo "📝 Generating changelog for first release (all commits)"
          else
            RANGE="$LAST_TAG..HEAD"
            echo "📝 Generating changelog from $LAST_TAG to HEAD"
          fi
          
          cat > changelog.md << 'EOF'
          ## 🚀 Features
          
          EOF
          
          git log $RANGE --format="* %s (%h)" --grep="^feat" >> changelog.md 2>/dev/null || echo "_No new features_" >> changelog.md
          
          cat >> changelog.md << 'EOF'
          
          ## 🐛 Bug Fixes
          
          EOF
          
          git log $RANGE --format="* %s (%h)" --grep="^fix" >> changelog.md 2>/dev/null || echo "_No bug fixes_" >> changelog.md
          
          cat >> changelog.md << 'EOF'
          
          ## 🔧 Other Changes
          
          EOF
          
          git log $RANGE --format="* %s (%h)" --grep="^(chore|docs|style|refactor|perf|test|build|ci)" >> changelog.md 2>/dev/null || echo "_No other changes_" >> changelog.md
          
          CHANGELOG=$(cat changelog.md)
          echo "changelog<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGELOG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

  # ===========================================================================
  # Job 2 - Create the release and tags
  # ===========================================================================
  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: analyze
    if: needs.analyze.outputs.should_release == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.PAT_TOKEN }}

      - name: Create and push tag
        # Skip when the workflow was triggered BY a tag push — the tag already exists.
        if: github.ref_type != 'tag'
        env:
          # PAT required — GITHUB_TOKEN-triggered pushes don't fire other workflows
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}

          TAG="v${{ needs.analyze.outputs.version }}"
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"

      # ── Generate dist/install.yaml ───────────────────────────────────────
      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Install kustomize
        run: |
          KUSTOMIZE_VERSION=5.4.3
          curl -sSL "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv${KUSTOMIZE_VERSION}/kustomize_v${KUSTOMIZE_VERSION}_linux_amd64.tar.gz" \
            | tar -xz kustomize
          sudo mv kustomize /usr/local/bin/kustomize

      - name: Install controller-gen
        run: go install sigs.k8s.io/controller-tools/cmd/controller-gen@latest

      - name: Generate dist/install.yaml
        run: |
          mkdir -p dist
          controller-gen rbac:roleName=manager-role crd webhook paths="./..." output:crd:artifacts:config=config/crd/bases
          cd config/manager && kustomize edit set image controller=ghcr.io/${{ github.repository_owner }}/clamav-operator:v${{ needs.analyze.outputs.version }}
          cd ${{ github.workspace }}
          kustomize build config/default > dist/install.yaml
          echo "✅ dist/install.yaml generated ($(wc -l < dist/install.yaml) lines)"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ needs.analyze.outputs.version }}
          name: Release v${{ needs.analyze.outputs.version }}
          body: ${{ needs.analyze.outputs.changelog }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: dist/install.yaml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update CHANGELOG.md
        run: |
          VERSION="v${{ needs.analyze.outputs.version }}"
          DATE=$(date +%Y-%m-%d)
          
          if [ ! -f CHANGELOG.md ]; then
            echo "# Changelog" > CHANGELOG.md
            echo "" >> CHANGELOG.md
            echo "All notable changes to this project will be documented in this file." >> CHANGELOG.md
            echo "" >> CHANGELOG.md
          fi
          
          cat > changelog.tmp << EOF
          ## [$VERSION] - $DATE
          
          ${{ needs.analyze.outputs.changelog }}
          
          EOF
          
          if grep -q "^## \[" CHANGELOG.md 2>/dev/null; then
            awk '/^## \[/{print ""; system("cat changelog.tmp"); print; next} 1' CHANGELOG.md > CHANGELOG.md.new
            mv CHANGELOG.md.new CHANGELOG.md
          else
            cat changelog.tmp >> CHANGELOG.md
          fi
          
          rm -f changelog.tmp
          echo "✅ CHANGELOG.md updated with version $VERSION"

      - name: Commit CHANGELOG
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${{ secrets.PAT_TOKEN }}@github.com/${{ github.repository }}

          git add CHANGELOG.md
          git commit -m "chore: update CHANGELOG for v${{ needs.analyze.outputs.version }}" || echo "No changes to commit"
          # Always push to main (even if triggered by a tag, HEAD is detached on the tag commit)
          git push origin HEAD:main || echo "Nothing to push"

  # ===========================================================================
  # Job 3 — Build & Push Docker images (called via workflow_call)
  # ===========================================================================
  # We do NOT use the "push: tags: v*" trigger in docker-build.yml because
  # actions/checkout always tries to fetch refs/heads/main to initialise the
  # clone, and fails when the runner only has the tag ref.
  # We call the workflow directly from here (context: refs/heads/main)
  # → checkout can access main without issues.
  docker-build:
    name: Build & Push Docker Images
    needs: [analyze, release]
    if: needs.analyze.outputs.should_release == 'true'
    uses: ./.github/workflows/docker-build.yml
    with:
      release_tag: "v${{ needs.analyze.outputs.version }}"
      scanner_download_sigs: true
    secrets: inherit

