# =============================================================================
# ClamAV Operator — Docker Build & Push
# =============================================================================
# Builds two images:
#   1. clamav-operator        — Go operator (build/Dockerfile)
#   2. clamav-node-scanner    — Node.js standalone scanner (scanner/Dockerfile)
#
# Triggers:
#   • push to main / release branches  → build + push (latest tag)
#   • pull request to main             → build only (no push)
#   • manual dispatch (workflow_dispatch) → build visible in the Actions tab,
#     with optional release_tag input to generate semver tags manually
#   • workflow_call from release.yml → build + push with semver tags (auto releases)
#
# NOTE: The "push: tags: v*" trigger has been intentionally removed.
# Problem: actions/checkout always tries to resolve the default branch
# (fetch refs/heads/main), even with an explicit ref. When the runner is
# triggered by a tag push, it has no access to refs/heads/main
# → fatal: couldn't find remote ref refs/heads/main.
# Fix: release.yml calls this workflow via workflow_call (context: main).
# =============================================================================

name: Docker Build & Push

on:
  push:
    branches:
      - main
      - "release/**"

  # PRs: only build when relevant code changes
  pull_request:
    branches:
      - main
    paths:
      - "build/**"
      - "cmd/**"
      - "api/**"
      - "internal/**"
      - "go.mod"
      - "go.sum"
      - "scanner/**"
      - ".github/workflows/docker-build.yml"

  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to use for semver image tags (e.g. v1.2.3). Leave empty for a build without semver tags."
        required: false
        default: ""
        type: string
      push_images:
        description: "Push images to registry"
        required: false
        default: false
        type: boolean
      scanner_download_sigs:
        description: "Download ClamAV signatures during scanner build"
        required: false
        default: true
        type: boolean

  # Called by release.yml after tag creation — avoids checkout on a tag ref
  workflow_call:
    inputs:
      release_tag:
        description: "Release tag (e.g. v1.2.3) — used for semver image tags"
        type: string
        required: false
        default: ""
      scanner_download_sigs:
        description: "Download ClamAV signatures during scanner build"
        type: boolean
        required: false
        default: true

# ─── Permissions ──────────────────────────────────────────────────────────────
permissions:
  contents: read
  packages: write # Push to GHCR
  id-token: write # For cosign signing (optional)
  security-events: write

# ─── Concurrency ──────────────────────────────────────────────────────────────
concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

# ─── Environment ──────────────────────────────────────────────────────────────
env:
  REGISTRY: ghcr.io
  OPERATOR_IMAGE: ghcr.io/${{ github.repository_owner }}/clamav-operator
  SCANNER_IMAGE: ghcr.io/${{ github.repository_owner }}/clamav-node-scanner

jobs:
  # ===========================================================================
  # Job 1 — Lint & Test (runs in parallel with builds)
  # ===========================================================================
  test:
    name: Lint & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # ── Go tests (operator) ──────────────────────────────────────────────
      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Go vet
        run: go vet ./...

      - name: Go test
        run: go test ./... -short -count=1

      # ── Node.js tests (scanner) ─────────────────────────────────────────
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: scanner/package-lock.json

      - name: Install scanner dependencies
        working-directory: scanner
        run: npm ci --ignore-scripts 2>/dev/null || npm install --ignore-scripts

      - name: Run scanner tests
        working-directory: scanner
        run: node --test src/__tests__/*.test.js

  # ===========================================================================
  # Job 2 — Build & Push: clamav-operator (Go)
  # ===========================================================================
  build-operator:
    name: "Build: clamav-operator"
    runs-on: ubuntu-latest
    needs: test
    outputs:
      image_digest: ${{ steps.build-push.outputs.digest }}
      image_tags: ${{ steps.meta.outputs.tags }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # ── Docker meta (tags & labels) ──────────────────────────────────────
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.OPERATOR_IMAGE }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}},value=${{ inputs.release_tag }},enable=${{ inputs.release_tag != '' }}
            type=semver,pattern={{major}}.{{minor}},value=${{ inputs.release_tag }},enable=${{ inputs.release_tag != '' }}
            type=semver,pattern={{major}},value=${{ inputs.release_tag }},enable=${{ inputs.release_tag != '' }}
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || inputs.release_tag != '' }}

      # ── Buildx setup ─────────────────────────────────────────────────────
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ── Registry login ───────────────────────────────────────────────────
      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ── Build & push ─────────────────────────────────────────────────────
      - name: Build and push operator image
        id: build-push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: build/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' && (github.event.inputs.push_images != 'false' || true) }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=operator
          cache-to: type=gha,mode=max,scope=operator
          build-args: |
            TARGETOS=linux

      # ── Summary ──────────────────────────────────────────────────────────
      - name: Image summary
        run: |
          echo "## Operator Image" >> $GITHUB_STEP_SUMMARY
          echo "**Digest:** \`${{ steps.build-push.outputs.digest }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Tags:**" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.meta.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

  # ===========================================================================
  # Job 3 — Build & Push: clamav-node-scanner (Node.js + ClamAV standalone)
  # ===========================================================================
  build-scanner:
    name: "Build: clamav-node-scanner"
    runs-on: ubuntu-latest
    needs: test
    outputs:
      image_digest: ${{ steps.build-push.outputs.digest }}
      image_tags: ${{ steps.meta.outputs.tags }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # ── Docker meta ───────────────────────────────────────────────────────
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.SCANNER_IMAGE }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}},value=${{ inputs.release_tag }},enable=${{ inputs.release_tag != '' }}
            type=semver,pattern={{major}}.{{minor}},value=${{ inputs.release_tag }},enable=${{ inputs.release_tag != '' }}
            type=semver,pattern={{major}},value=${{ inputs.release_tag }},enable=${{ inputs.release_tag != '' }}
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || inputs.release_tag != '' }}

      # ── Buildx setup ─────────────────────────────────────────────────────
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ── Registry login ───────────────────────────────────────────────────
      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ── Build & push ─────────────────────────────────────────────────────
      - name: Build and push scanner image
        id: build-push
        uses: docker/build-push-action@v6
        with:
          context: scanner/
          file: scanner/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=scanner
          cache-to: type=gha,mode=max,scope=scanner
          build-args: |
            DOWNLOAD_SIGS=${{ inputs.scanner_download_sigs }}

      # ── Summary ──────────────────────────────────────────────────────────
      - name: Image summary
        run: |
          echo "## Scanner Image" >> $GITHUB_STEP_SUMMARY
          echo "**Digest:** \`${{ steps.build-push.outputs.digest }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Tags:**" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.meta.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

  # ===========================================================================
  # Job 4 — Build scanner air-gap variant (no signature download)
  # ===========================================================================
  build-scanner-airgap:
    name: "Build: clamav-node-scanner (airgap)"
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' || inputs.release_tag != ''
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.SCANNER_IMAGE }}
          flavor: |
            suffix=-airgap,onlatest=true
          tags: |
            type=semver,pattern={{version}},value=${{ inputs.release_tag }},enable=${{ inputs.release_tag != '' }}
            type=semver,pattern={{major}}.{{minor}},value=${{ inputs.release_tag }},enable=${{ inputs.release_tag != '' }}
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || inputs.release_tag != '' }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push scanner airgap image
        uses: docker/build-push-action@v6
        with:
          context: scanner/
          file: scanner/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=scanner-airgap
          cache-to: type=gha,mode=max,scope=scanner-airgap
          build-args: |
            DOWNLOAD_SIGS=false

  # ===========================================================================
  # Job 5 — Security scan with Trivy
  # ===========================================================================
  # ROOT CAUSE of the recurring bug:
  #   trivy-action downloads Trivy via a script that calls api.github.com
  #   without auth. On shared runners the rate-limit (60 req/h) is often
  #   exhausted → silent exit code 1.
  # FIX: Install Trivy via apt so no GitHub API calls are made at all.
  # ===========================================================================
  security-scan:
    name: "Security Scan"
    runs-on: ubuntu-latest
    needs: [build-operator, build-scanner]
    if: github.event_name != 'pull_request'
    strategy:
      matrix:
        include:
          - image_name: operator
            image_ref: ${{ needs.build-operator.outputs.image_tags }}
          - image_name: scanner
            image_ref: ${{ needs.build-scanner.outputs.image_tags }}
    steps:
      # Explicit checkout required by github/codeql-action/upload-sarif@v4:
      # that action attempts an implicit checkout if the repo is not already cloned,
      # which triggers the "couldn't find remote ref refs/heads/main" bug.
      # fetch-depth: 0 prevents the blobless clone that causes it.
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Extract first tag from the multi-line tags output
      - name: Resolve image tag
        id: resolve
        run: |
          TAG=$(echo "${{ matrix.image_ref }}" | head -n 1)
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      # Install Trivy via apt (official Aqua Security repo) to avoid calls to
      # the GitHub Releases API that fail with exit code 1 due to rate-limiting
      # on shared runner IPs (60 anonymous req/h).
      - name: Install Trivy via apt
        run: |
          sudo apt-get install -y wget apt-transport-https gnupg
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key \
            | gpg --dearmor \
            | sudo tee /usr/share/keyrings/trivy.gpg > /dev/null
          echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb generic main" \
            | sudo tee /etc/apt/sources.list.d/trivy.list
          sudo apt-get update && sudo apt-get install -y trivy

      - name: Trivy vulnerability scan
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: ${{ steps.resolve.outputs.tag }}
          format: "sarif"
          output: "trivy-${{ matrix.image_name }}.sarif"
          severity: "CRITICAL,HIGH"
          ignore-unfixed: true
          skip-setup-trivy: true  # binary already installed via apt above

      - name: Upload Trivy SARIF
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: "trivy-${{ matrix.image_name }}.sarif"
          category: "trivy-${{ matrix.image_name }}"
