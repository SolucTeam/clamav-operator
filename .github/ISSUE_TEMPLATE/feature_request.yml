name: 💡 Feature request
description: Propose an improvement or a new capability
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Have an idea to make ClamAV scanning on Kubernetes better? Tell us!
        For significant changes (new CRDs, architectural changes), please open a
        [Discussion](https://github.com/SolucTeam/clamav-operator/discussions/categories/ideas)
        first so we can align on the design.
  - type: textarea
    id: problem
    attributes:
      label: Problem / use case
      description: What are you trying to achieve? What is blocking you today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What would you like to happen? YAML snippets of a dream API are gold.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Scanning (strategy, performance, incremental)
        - Scheduling
        - Notifications
        - Observability (metrics / dashboards / alerts)
        - Security (RBAC, pod security, signatures)
        - Air-gap / offline support
        - Helm chart / installation
        - Documentation
        - Other
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: willing
    attributes:
      label: Contribution
      options:
        - label: I am willing to submit a PR for this feature
