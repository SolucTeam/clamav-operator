<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 140" width="520" height="140">
  <defs>
    <!-- Shield gradient — deep navy to bright blue -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#1a2f5e"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <!-- Inner glow for shield -->
    <radialGradient id="shieldGlow" cx="50%" cy="35%" r="60%">
      <stop offset="0%"   stop-color="#60a5fa" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#1a2f5e" stop-opacity="0"/>
    </radialGradient>
    <!-- Kubernetes hex gradient -->
    <linearGradient id="hexGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <!-- Virus red gradient -->
    <radialGradient id="virusGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#fca5a5"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </radialGradient>
    <!-- Drop shadow -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#00000040"/>
    </filter>
    <!-- Glow filter for checkmark -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- ══════════════════════════════════════════════════════
       SHIELD ICON (left)
  ══════════════════════════════════════════════════════ -->
  <g transform="translate(12, 8)" filter="url(#shadow)">
    <!-- Shield body -->
    <path d="M54 4 L96 20 L96 62 Q96 100 54 118 Q12 100 12 62 L12 20 Z"
          fill="url(#shieldGrad)" stroke="#3b82f6" stroke-width="1.5"/>
    <!-- Inner glow overlay -->
    <path d="M54 4 L96 20 L96 62 Q96 100 54 118 Q12 100 12 62 L12 20 Z"
          fill="url(#shieldGlow)"/>
    <!-- Shield border highlight -->
    <path d="M54 10 L90 24 L90 62 Q90 96 54 112"
          fill="none" stroke="#93c5fd" stroke-width="1" stroke-opacity="0.4"/>

    <!-- Kubernetes-style hex ring (background) -->
    <g transform="translate(54, 61)">
      <!-- Hex outline -->
      <polygon points="0,-26 22.5,-13 22.5,13 0,26 -22.5,13 -22.5,-13"
               fill="none" stroke="#60a5fa" stroke-width="1.5" stroke-opacity="0.5"/>
      <!-- Hex dots at vertices -->
      <circle cx="0"    cy="-26" r="2" fill="#60a5fa" opacity="0.7"/>
      <circle cx="22.5" cy="-13" r="2" fill="#60a5fa" opacity="0.7"/>
      <circle cx="22.5" cy="13"  r="2" fill="#60a5fa" opacity="0.7"/>
      <circle cx="0"    cy="26"  r="2" fill="#60a5fa" opacity="0.7"/>
      <circle cx="-22.5" cy="13" r="2" fill="#60a5fa" opacity="0.7"/>
      <circle cx="-22.5" cy="-13" r="2" fill="#60a5fa" opacity="0.7"/>
    </g>

    <!-- Virus blob (red, crossed-out style) -->
    <g transform="translate(40, 47)">
      <circle cx="14" cy="14" r="12" fill="url(#virusGrad)" opacity="0.9"/>
      <!-- Spikes -->
      <line x1="14" y1="0"  x2="14" y2="-6"  stroke="#fca5a5" stroke-width="2" stroke-linecap="round"/>
      <line x1="25" y1="3"  x2="30" y2="-1"  stroke="#fca5a5" stroke-width="2" stroke-linecap="round"/>
      <line x1="28" y1="14" x2="34" y2="14"  stroke="#fca5a5" stroke-width="2" stroke-linecap="round"/>
      <line x1="25" y1="25" x2="30" y2="29"  stroke="#fca5a5" stroke-width="2" stroke-linecap="round"/>
      <line x1="14" y1="28" x2="14" y2="34"  stroke="#fca5a5" stroke-width="2" stroke-linecap="round"/>
      <line x1="3"  y1="25" x2="-2" y2="29"  stroke="#fca5a5" stroke-width="2" stroke-linecap="round"/>
      <line x1="0"  y1="14" x2="-6" y2="14"  stroke="#fca5a5" stroke-width="2" stroke-linecap="round"/>
      <line x1="3"  y1="3"  x2="-2" y2="-1"  stroke="#fca5a5" stroke-width="2" stroke-linecap="round"/>
      <!-- X cross (eliminated) -->
      <line x1="8" y1="8" x2="20" y2="20" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="20" y1="8" x2="8" y2="20" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
    </g>

    <!-- Green checkmark shield-check (protection OK) -->
    <g transform="translate(62, 82)" filter="url(#glow)">
      <circle cx="10" cy="10" r="10" fill="#16a34a" opacity="0.95"/>
      <polyline points="4,10 8,14 16,6" fill="none" stroke="white"
                stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>

  <!-- ══════════════════════════════════════════════════════
       WORDMARK
  ══════════════════════════════════════════════════════ -->
  <g transform="translate(126, 0)">
    <!-- "clamav" — white, bold -->
    <text x="0" y="76"
          font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
          font-size="54" font-weight="700" letter-spacing="-1"
          fill="#ffffff">clamav</text>

    <!-- "-operator" — blue accent -->
    <text x="4" y="108"
          font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
          font-size="24" font-weight="400" letter-spacing="6"
          fill="#60a5fa">— operator</text>

    <!-- Tagline -->
    <text x="5" y="128"
          font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
          font-size="11" font-weight="300" letter-spacing="2"
          fill="#94a3b8">Kubernetes Antivirus Operator</text>
  </g>

  <!-- ══════════════════════════════════════════════════════
       K8s pill badge (top-right)
  ══════════════════════════════════════════════════════ -->
  <g transform="translate(398, 18)">
    <rect x="0" y="0" width="108" height="22" rx="11"
          fill="none" stroke="#3b82f6" stroke-width="1.2" opacity="0.7"/>
    <!-- Hex icon small -->
    <polygon points="11,4 17,7.5 17,14.5 11,18 5,14.5 5,7.5"
             fill="url(#hexGrad)" opacity="0.85"/>
    <text x="22" y="15.5"
          font-family="'Segoe UI', Arial, sans-serif"
          font-size="10" font-weight="600" letter-spacing="1.5"
          fill="#93c5fd">KUBERNETES</text>
  </g>
</svg>
