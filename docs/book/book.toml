[book]
title       = "ClamAV Operator"
description = "Kubernetes-native antivirus operator — automated ClamAV scanning across every node in your cluster"
authors     = ["SolucTeam"]
language    = "en"
src         = "src"

[output.html]
site-url            = "/clamav-operator/"
git-repository-url  = "https://github.com/SolucTeam/clamav-operator"
git-repository-icon = "fa-github"
edit-url-template   = "https://github.com/SolucTeam/clamav-operator/edit/main/docs/book/src/{path}"
additional-css      = ["theme/custom.css"]
no-section-label    = false

[output.html.search]
enable         = true
limit-results  = 20
use-boolean-and = true
boost-title    = 2
boost-hierarchy = 1
boost-paragraph = 1

[output.html.fold]
enable = true
level  = 1
