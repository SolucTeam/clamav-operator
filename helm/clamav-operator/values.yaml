# Default values for clamav-operator.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.
#
# Environment-specific configurations:
# - Development: Use lower resources, disable HA features
# - Production: Use higher resources, enable HA and monitoring
#
# To customize for your environment, override these values with:
#   helm install clamav-operator ./helm/clamav-operator -f custom-values.yaml

# =============================================================================
# OPERATOR CONFIGURATION
# =============================================================================
operator:
  # Number of operator replicas.
  # 2 is the production minimum: keeps the admission webhook (failurePolicy: Fail)
  # available during rolling updates, node drains, and pod restarts.
  # Use 1 only in development / single-node clusters.
  replicaCount: 2

  image:
    # Image repository - update for your private registry
    repository: ghcr.io/solucteam/clamav-operator
    pullPolicy: IfNotPresent
    # Overrides the image tag whose default is the chart appVersion.
    # Development: "latest", Production: specific version like "v1.0.0"
    tag: ""

  # Image pull secrets for private registries
  imagePullSecrets: []
  # - name: regcred

  nameOverride: ""
  fullnameOverride: ""

  serviceAccount:
    # Specifies whether a service account should be created
    create: true
    # Automatically mount a ServiceAccount's API credentials?
    automount: true
    # Annotations to add to the service account
    annotations: {}
    # The name of the service account to use.
    # If not set and create is true, a name is generated using the fullname template
    name: ""

  podAnnotations: {}
  podLabels: {}

  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 65532
    runAsGroup: 65532
    fsGroup: 65532
    seccompProfile:
      type: RuntimeDefault

  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
      - ALL
    readOnlyRootFilesystem: true
    runAsNonRoot: true
    runAsUser: 65532

  # Service for metrics and health
  service:
    type: ClusterIP
    port: 8080
    metricsPort: 8080
    healthPort: 8081

  # Resource limits and requests for the operator pod.
  # Not set by default — define in your own values file.
  # Example:
  #   resources:
  #     requests: { cpu: 100m, memory: 128Mi }
  #     limits: { cpu: 500m, memory: 256Mi }
  resources: {}

  # Leader election settings
  leaderElection:
    # Disable in development for simpler debugging
    enabled: true
    leaseDuration: 15s
    renewDeadline: 10s
    retryPeriod: 2s

  # Node selector for operator pod
  nodeSelector: {}

  tolerations: []

  # Pod anti-affinity — spreads the 2 operator replicas across different nodes
  # so a single node failure or drain never takes both pods down simultaneously.
  #
  # preferredDuring (soft) is used instead of requiredDuring (hard) so that
  # scheduling still succeeds on single-node clusters or when only one node is
  # available (e.g. after a node failure). Change to requiredDuring only if your
  # cluster always has ≥ 2 schedulable nodes.
  affinity:
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            labelSelector:
              matchLabels:
                control-plane: controller-manager
            topologyKey: kubernetes.io/hostname

  # PodDisruptionBudget — prevents voluntary disruptions (node drains, evictions)
  # from taking the operator below 1 running replica.
  # Requires replicaCount ≥ 2; disable when replicaCount=1.
  podDisruptionBudget:
    enabled: true
    # minAvailable: 1 ensures at least 1 replica stays up during disruptions.
    minAvailable: 1
    # Alternatively use maxUnavailable (comment out minAvailable and set this):
    # maxUnavailable: 1

  # Priority class name for production: system-cluster-critical
  priorityClassName: ""

# =============================================================================
# SCANNER CONFIGURATION
# =============================================================================
scanner:
  image:
    repository: ghcr.io/solucteam/clamav-node-scanner
    # Defaults to Chart.AppVersion when empty — keeps operator and scanner in sync.
    # Override for a specific scanner version: tag: "v0.2.0"
    tag: ""
    pullPolicy: IfNotPresent

  # Scan mode: "standalone" or "remote"
  # - standalone: clamscan binary + signatures embedded in the scanner image.
  #   Zero network dependency, each node scans locally.
  # - remote: connects to a central clamd service (legacy behaviour).
  mode: standalone

  # ClamAV remote service configuration (used only when mode=remote)
  clamav:
    host: clamav.clamav.svc.cluster.local
    port: 3310

  # Standalone-mode binary paths (override if your image differs)
  standalone:
    clamscanPath: /usr/bin/clamscan
    clamavDbPath: /var/lib/clamav

  # ---------------------------------------------------------------------------
  # Freshclam – ClamAV signature updates
  # ---------------------------------------------------------------------------
  freshclam:
    # Enable automatic signature updates via freshclam CronJob.
    #
    # IMPORTANT – standalone mode limitation:
    #   In standalone mode the scanner runs clamscan from inside the scanner
    #   container image. Signatures are read from CLAMAV_DB_PATH (/var/lib/clamav)
    #   in the container image filesystem. The freshclam CronJob writes to its
    #   own isolated volume (emptyDir or PVC below) that scanner job pods never
    #   mount — so enabling freshclam does NOT update the signatures that scanner
    #   jobs use in standalone mode.
    #
    #   To have up-to-date signatures in standalone mode, bake them into the
    #   scanner image at build time (run freshclam during docker build or COPY
    #   a pre-downloaded /var/lib/clamav directory into the image).
    #
    #   In remote mode, freshclam writes to the shared PVC that the clamd daemon
    #   also reads from — this is the only configuration where freshclam is
    #   effective at runtime.
    #
    #   Set enabled=false for air-gapped environments (no internet access).
    enabled: true
    # Cron schedule – default every 6 hours
    schedule: "0 */6 * * *"
    image:
      repository: clamav/clamav
      tag: "1.3"
      pullPolicy: IfNotPresent
    # Resources for the freshclam CronJob pod.
    # Not set by default — define in your own values file.
    # Example:
    #   resources:
    #     requests: { cpu: 100m, memory: 128Mi }
    #     limits: { cpu: 500m, memory: 256Mi }
    resources: {}

  # ---------------------------------------------------------------------------
  # Signature persistence
  #
  # When persistent=true AND freshclam.enabled=true:
  #   - A PVC (pvcName below) is created and mounted by the freshclam CronJob.
  #   - The operator also mounts the same PVC (read-only) in every scanner Job
  #     pod at CLAMAV_DB_PATH. This means freshclam-updated signatures are
  #     immediately visible to scanner jobs without rebuilding the image.
  #   - This is the recommended setup for connected (non-air-gap) standalone
  #     deployments.
  #
  # When persistent=false (default) OR freshclam.enabled=false:
  #   - The freshclam CronJob uses an emptyDir (discarded on pod exit) or is
  #     disabled entirely.
  #   - Scanner jobs do NOT mount any signatures volume — they rely on
  #     signatures baked into the scanner image at build time.
  #   - Use this for air-gap environments (build your image with freshclam
  #     run during docker build) or remote-mode deployments.
  # ---------------------------------------------------------------------------
  signatures:
    # Use a PersistentVolumeClaim to share signatures between the freshclam CronJob
    # and scanner Job pods. Set to true for connected standalone mode so that
    # signature updates take effect without an image rebuild.
    # When false, signatures must be baked into the scanner image.
    persistent: false
    pvcName: clamav-signatures
    storageClass: ""
    # Access mode for the signatures PVC.
    #
    # ReadWriteOnce (default): works only if all scanner jobs happen to land on
    # the same node as the freshclam pod — which is NOT guaranteed in multi-node
    # clusters. Scanner jobs on other nodes will fail with "Multi-Attach error".
    #
    # ReadWriteMany (recommended when persistent=true): allows freshclam to write
    # and scanner jobs on ANY node to read simultaneously. Requires a storage
    # backend that supports RWX: NFS, CephFS, Azure Files, AWS EFS, GCP Filestore.
    # Standard block storage (EBS, GCP Persistent Disk) does NOT support RWX.
    #
    # If your cluster has no RWX storage class, leave persistent: false and bake
    # signatures into the scanner image instead (see air-gap example).
    accessMode: ReadWriteOnce
    size: 1Gi

  # ---------------------------------------------------------------------------
  # Incremental scan settings
  # ---------------------------------------------------------------------------
  incremental:
    enabled: true
    # Strategy: "full" | "incremental" | "smart"
    # - full: scan every file every time
    # - incremental: only scan new/modified files since last run
    # - smart: full scan periodically, incremental in between
    strategy: smart
    # For smart strategy: run a full scan every N incremental scans
    fullScanInterval: 10
    # Maximum file age in hours to consider for incremental scans.
    # ⚠️  IMPORTANT: this must be greater than your scan interval to avoid
    # treating every file as "too old" and falling back to a full scan.
    # Example: daily scans → set to 168 (7 days). 24 h with daily scans
    # means every cached file expires before the next run — defeating incremental.
    maxFileAgeHours: 168
    # Skip files whose mtime+size haven't changed since last scan
    skipUnchangedFiles: true
    # Maximum number of JSON scan reports to retain per node on the hostPath.
    # Oldest reports are automatically deleted after each scan.
    # Set to 0 to disable rotation (keep all reports — not recommended).
    maxScanReports: 30

  # Hard timeout for scanner Jobs in seconds.
  # 0 means use the built-in default of 7200 s (2 h).
  # Increase on nodes with very large filesystems whose scans may take more than 2 h.
  # Example: 14400 for a 4-hour deadline.
  jobActiveDeadlineSeconds: 0

  # TTL (seconds) before Kubernetes auto-deletes a succeeded scanner Job.
  # The CRD is the source of truth — the Job pod is disposable once results
  # are recorded. Keep short to avoid accumulating idle pods.
  # 0 = use built-in default of 3600 s (1 h).
  jobTTLSecondsAfterSucceeded: 0

  # TTL (seconds) before Kubernetes auto-deletes a failed scanner Job.
  # Keep long enough for log inspection after a scan failure.
  # 0 = use built-in default of 86400 s (24 h).
  jobTTLSecondsAfterFailed: 0

  # ServiceAccount for scanner jobs
  serviceAccount:
    create: true
    name: clamav-scanner
    annotations: {}

  # Default resources for scanner jobs.
  # Not set here — define them in defaultScanPolicy.spec.resources (applied via ScanPolicy)
  # or override per-scan in NodeScan.spec.resources / ClusterScan nodeScanTemplate.resources.
  # Example:
  #   resources:
  #     requests: { cpu: 500m, memory: 1Gi }
  #     limits: { cpu: 1000m, memory: 2Gi }
  # Image pull secrets for scanner jobs
  imagePullSecrets: []
  # - name: regcred

# =============================================================================
# CUSTOM RESOURCE DEFINITIONS
# =============================================================================
# CRDs are placed in the Helm-native crds/ directory (chart root) and are
# always installed/upgraded by Helm before chart resources.
# The "helm.sh/resource-policy: keep" annotation is baked into each CRD,
# so they are retained on `helm uninstall` to protect existing scan data.
# (These values are kept for backward compatibility but have no effect.)
crds:
  install: true
  keep: true

# =============================================================================
# RBAC CONFIGURATION
# =============================================================================
rbac:
  # Create RBAC resources
  create: true

  # ClusterRole rules for the operator
  clusterRoleRules:
    - apiGroups:
        - ""
      resources:
        - nodes
      verbs:
        - get
        - list
        - watch
    # Required by startup_checks.go: checkAPIServerConnectivity calls Namespaces().List()
    - apiGroups:
        - ""
      resources:
        - namespaces
      verbs:
        - get
        - list
        - watch
    # Required by startup_checks.go: checkScannerServiceAccount calls ServiceAccounts(ns).Get()
    - apiGroups:
        - ""
      resources:
        - serviceaccounts
      verbs:
        - get
        - list
        - watch
    - apiGroups:
        - ""
      resources:
        - events
      verbs:
        - create
        - patch
    - apiGroups:
        - ""
      resources:
        - pods
        - pods/log
      verbs:
        - get
        - list
        - watch
    - apiGroups:
        - ""
      resources:
        - services
        - endpoints
      verbs:
        - get
        - list
    - apiGroups:
        - batch
      resources:
        - jobs
      verbs:
        - create
        - get
        - list
        - watch
        - update
        - patch
        - delete
    - apiGroups:
        - clamav.io
      resources:
        - nodescans
        - clusterscans
        - scanpolicies
        - scanschedules
        - scancacheresources
      verbs:
        - create
        - delete
        - get
        - list
        - patch
        - update
        - watch
    - apiGroups:
        - clamav.io
      resources:
        - nodescans/finalizers
        - clusterscans/finalizers
        - scanpolicies/finalizers
        - scanschedules/finalizers
        - scancacheresources/finalizers
      verbs:
        - update
    - apiGroups:
        - clamav.io
      resources:
        - nodescans/status
        - clusterscans/status
        - scanpolicies/status
        - scanschedules/status
        - scancacheresources/status
      verbs:
        - get
        - patch
        - update

# =============================================================================
# CRD PATCHER HOOK
# =============================================================================
# Post-install/post-upgrade Job that patches the three CRDs (NodeScan,
# ClusterScan, ScanSchedule) with conversion.strategy: Webhook.
# Only runs when webhook.enabled=true.
crdPatcher:
  image:
    # registry.k8s.io/kubectl is the official, Google-maintained kubectl image.
    # Pin the tag to the minor version of your cluster (e.g. "1.29", "1.30").
    # Any image that provides a kubectl binary at /usr/bin/kubectl works.
    repository: registry.k8s.io/kubectl
    tag: "1.29"
    pullPolicy: IfNotPresent

  # Pull secrets for the patcher Job pods (air-gap / private registry).
  # Format: list of {name: <secret>} — same structure as pod.spec.imagePullSecrets.
  imagePullSecrets: []
  # Example:
  #   imagePullSecrets:
  #     - name: regcred

# =============================================================================
# WEBHOOK CONFIGURATION
# =============================================================================
webhook:
  enabled: true
  port: 9443

  # Certificate management
  # STRONGLY RECOMMENDED for production: set certManager.enabled=true.
  # cert-manager handles automatic rotation and survives pod restarts.
  certManager:
    enabled: true

  # If certManager is disabled, use these certificates.
  # WARNING: autoGenerate=true produces self-signed certs stored in a Secret.
  # These certs are NOT rotated automatically and do NOT survive Secret deletion
  # or namespace recreation. For production, use certManager.enabled=true or
  # supply your own long-lived certs via caBundle/tlsCert/tlsKey.
  certificates:
    # Auto-generate self-signed certificates (development only)
    autoGenerate: true
    # Or provide your own
    caBundle: ""
    tlsCert: ""
    tlsKey: ""

# =============================================================================
# MONITORING CONFIGURATION
# =============================================================================
monitoring:
  # Enable ServiceMonitor for Prometheus Operator
  serviceMonitor:
    # Development: false, Production: true
    enabled: false
    # Prometheus instance selector
    selector:
      prometheus: kube-prometheus
    # Scrape interval (Production: 60s)
    interval: 30s
    # Scrape timeout
    scrapeTimeout: 30s
    # Additional labels
    labels: {}
    # Honor labels
    honorLabels: false

  # Enable PrometheusRule for alerts
  prometheusRule:
    # Development: false, Production: true
    enabled: false
    # Additional labels
    labels: {}
    # Alert rules
    rules:
      - alert: ClamAVMalwareDetected
        expr: increase(clamav_files_infected_total[5m]) > 0
        for: 1m
        labels:
          severity: critical
          team: security
        annotations:
          summary: "Malware detected on node {{ $labels.node }}"
          description: "{{ $value }} infected files detected"

      # FIX: was `for: 5m` with `increase([5m])` — the counter window expired
      # before the `for` fired, causing consistent false negatives.
      # Using increase([10m]) gives Prometheus 10 min of counter history so the
      # `for: 0m` fires immediately on the first evaluation that sees a failure.
      - alert: ClamAVScanFailed
        expr: increase(clamav_nodescans_total{status="Failed"}[10m]) > 0
        for: 0m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "ClamAV scan failed on node {{ $labels.node }}"
          description: "{{ $value }} scan(s) failed in the last 10 minutes on node {{ $labels.node }} (namespace={{ $labels.namespace }})."

      # FIX: was `time() - clamav_nodescan_last_completion_timestamp > 86400`
      # which fired permanently on nodes that have NEVER scanned (timestamp=0,
      # so time()-0 = now ≈ 1.7B seconds >> 86400).
      # Added `> 0` guard: only alert on nodes that have completed at least one
      # scan and then went silent. Nodes that have never scanned are a separate
      # concern covered by ClamAVNodeNeverScanned below.
      - alert: ClamAVNoRecentScans
        expr: |
          (clamav_nodescan_last_completion_timestamp > 0)
          and
          (time() - clamav_nodescan_last_completion_timestamp > 86400)
        for: 1h
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "No recent ClamAV scan on node {{ $labels.node }}"
          description: "Node {{ $labels.node }} last completed a scan {{ $value | humanizeDuration }} ago (> 24 h). Check the ScanSchedule and scanner Job logs."

      - alert: ClamAVNotificationFailed
        expr: increase(clamav_notifications_failed_total[15m]) > 0
        for: 5m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "ClamAV notification delivery failed (channel={{ $labels.channel }})"
          description: "{{ $value }} notifications failed to deliver in the last 15 minutes via channel={{ $labels.channel }}. Check webhook/SMTP config."

      - alert: ClamAVPartialScanResults
        expr: clamav_nodescan_partial_results > 0
        for: 10m
        labels:
          severity: warning
          team: security
        annotations:
          summary: "ClamAV scan returned partial results on node {{ $labels.node }}"
          description: "NodeScan on node {{ $labels.node }} has partial/unreliable results. Do NOT treat as clean — re-run required."

      # FIX: cert-manager may not be installed → metric absent → alert never fires
      # (silently broken). Wrapped with `unless absent(...)` so the alert is
      # suppressed entirely when cert-manager is not present rather than hiding
      # a misconfiguration. Teams using cert-manager will still get notified.
      - alert: ClamAVWebhookCertExpiringSoon
        expr: |
          (certmanager_certificate_expiration_timestamp_seconds{name=~".*clamav.*webhook.*"} - time() < 604800)
          unless absent(certmanager_certificate_expiration_timestamp_seconds{name=~".*clamav.*webhook.*"})
        for: 1h
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "ClamAV webhook certificate expiring within 7 days"
          description: "Certificate {{ $labels.name }} expires in {{ $value | humanizeDuration }}. Verify cert-manager CertificateRequest and renew if needed."

      - alert: ClamAVResultsDirTooLarge
        expr: clamav_results_dir_bytes > 524288000
        for: 30m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "ClamAV results directory too large on node {{ $labels.node }}"
          description: "Results hostPath (/var/log/clamav-scans) is {{ $value | humanizeBytes }} on node {{ $labels.node }}. Decrease scanner.maxScanReports or check rotation."

      - alert: ClamAVCacheFileTooLarge
        expr: clamav_cache_file_bytes > 104857600
        for: 30m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "ClamAV incremental cache file too large on node {{ $labels.node }}"
          description: "Cache file is {{ $value | humanizeBytes }} on node {{ $labels.node }}. Cache pruning may not be working — check scanner logs."

      # ── NEW: Operator health ──────────────────────────────────────────────
      # controller-runtime exposes controller_runtime_reconcile_errors_total
      # automatically. A sustained error rate means the operator is unable to
      # process NodeScan/ClusterScan events (API server unreachable, RBAC issue…).
      - alert: ClamAVOperatorReconcileErrors
        expr: rate(controller_runtime_reconcile_errors_total{controller=~"nodescan|clusterscan|scanschedule"}[5m]) > 0.1
        for: 10m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "ClamAV operator reconcile errors elevated (controller={{ $labels.controller }})"
          description: "{{ $labels.controller }} controller has {{ $value | humanize }} errors/s over the last 5 minutes. Check operator logs and K8s API connectivity."

      # ── NEW: Stuck scan detection ─────────────────────────────────────────
      # A NodeScan staying in Running phase for > 3 h is almost certainly a
      # zombie: the Job pod is stuck, OOMKilled in a retry loop, or the node
      # lost connectivity. activeDeadlineSeconds should kill it, but this alert
      # catches configuration gaps and provides earlier visibility.
      - alert: ClamAVScanStuck
        expr: clamav_nodescans_running > 0 and (time() - clamav_nodescan_last_completion_timestamp) > 36000
        for: 30m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "ClamAV scan appears stuck on node {{ $labels.node }}"
          description: "Node {{ $labels.node }} has had a running NodeScan for > 10 h with no completion. Check Job status and scanner pod logs."

      # ── NEW: High scan duration ───────────────────────────────────────────
      # p95 > 7200 s (2 h) indicates the filesystem has grown beyond scanner
      # capacity, the node I/O is saturated, or signatures are too large.
      - alert: ClamAVHighScanDuration
        expr: histogram_quantile(0.95, sum by (node, le) (rate(clamav_scan_duration_seconds_bucket[30m]))) > 7200
        for: 1h
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "ClamAV scan duration p95 > 2 h on node {{ $labels.node }}"
          description: "p95 scan duration on node {{ $labels.node }} is {{ $value | humanizeDuration }}. Consider enabling incremental scanning, reducing scan paths, or increasing resources."

      # ── NEW: Scan throughput regression ──────────────────────────────────
      # A sudden drop in files/s (vs the rolling average) indicates I/O
      # degradation, OOM pressure, or a clamscan binary issue.
      - alert: ClamAVLowScanThroughput
        expr: |
          (clamav_scan_files_per_second > 0)
          and
          (clamav_scan_files_per_second < 5)
        for: 30m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "ClamAV scan throughput very low on node {{ $labels.node }}"
          description: "Scan throughput on node {{ $labels.node }} is {{ $value | humanize }} files/s (threshold: 5 files/s). Check node I/O, memory pressure, and scanner resource limits."

      # ── NEW: Stale ClamAV signatures ─────────────────────────────────────
      # Signatures older than 24 h mean the scanner may miss threats discovered
      # after the last freshclam update.  Requires standalone mode or a clamd
      # sidecar that updates signatures and touches the .cvd/.cld files.
      - alert: ClamAVSignaturesStale
        expr: clamav_signature_db_age_seconds > 86400
        for: 1h
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "ClamAV signature database is stale on node {{ $labels.node }}"
          description: "Signatures on node {{ $labels.node }} are {{ $value | humanizeDuration }} old (threshold: 24 h). Check freshclam / signature update configuration."

      # ── NEW: OOMKilled scanner pods ───────────────────────────────────────
      # Each OOMKill (exit 137) means the scanner ran out of memory and was
      # killed by the kernel.  Sustained kills indicate resource limits that
      # are too low for the workload.
      - alert: ClamAVOOMKillsElevated
        expr: increase(clamav_job_oom_kills_total[1h]) > 2
        for: 0m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "ClamAV scanner OOMKilled repeatedly on node {{ $labels.node }}"
          description: "Node {{ $labels.node }} had {{ $value }} OOMKilled scanner pods in the last hour. Increase the scanner pod memory limits or reduce the scan paths."

# =============================================================================
# DEFAULT SCAN POLICY
# =============================================================================
defaultScanPolicy:
  # Create a default ScanPolicy resource
  enabled: true
  name: default-policy
  spec:
    # Paths to scan
    paths:
      - /var/lib
      - /opt
      - /usr/local

    # Exclude patterns
    excludePatterns:
      - "*.tmp"
      - "*.log"
      - "/var/lib/docker/overlay2/*"
      - "/var/lib/containerd/*"

    # Maximum concurrent file scans per node.
    # Reduced to 2 (from 3) to limit CPU pressure on busy nodes.
    # Tune upward only on dedicated scanning nodes.
    maxConcurrent: 2

    # File timeout in milliseconds
    fileTimeout: 300000

    # Maximum file size to scan in bytes (500MB)
    # Development: 104857600 (100MB), Production: 1073741824 (1GB)
    maxFileSize: 524288000

    # Resources for scan jobs — THIS is the canonical place to define scanner resources.
    # Applied to every scanner Job that uses this ScanPolicy.
    # Override per-scan via NodeScan.spec.resources or ClusterScan nodeScanTemplate.resources.
    # Not set by default — define in your own values file.
    # Example:
    #   resources:
    #     requests: { cpu: 500m, memory: 1Gi }
    #     limits: { cpu: 1000m, memory: 2Gi }
    resources: {}

    # Notifications (configure for production)
    # notifications:
    #   slack:
    #     enabled: true
    #     webhookSecretRef:
    #       name: slack-webhook-secret
    #       key: url
    #     channel: "#security-alerts"
    #     onlyOnInfection: true
    #   email:
    #     enabled: true
    #     smtpServer: smtp.example.com:587
    #     smtpAuthSecretRef:
    #       name: smtp-credentials
    #     from: clamav@example.com
    #     recipients:
    #       - security@example.com
    #     onlyOnInfection: true

# =============================================================================
# DEFAULT SCAN SCHEDULE
# =============================================================================
defaultScanSchedule:
  # Create a default ScanSchedule resource.
  # Set enabled=true to activate automatic cluster-wide scans.
  # All fields below have sensible defaults — override only what you need.
  enabled: false
  name: default-schedule

  # Cron expression for scan frequency.
  # Examples: "0 2 * * 0" (weekly), "0 2 1 * *" (monthly)
  schedule: "0 2 * * *"

  # Set to true to pause scheduled runs without deleting the resource.
  suspend: false

  # Forbid = skip new run if previous is still running (recommended).
  # Allow = run both in parallel. Replace = cancel running and start new.
  concurrencyPolicy: Forbid

  # ScanPolicy to use for each scheduled ClusterScan.
  # Must exist in the same namespace as the operator.
  scanPolicy: default-policy

  # Maximum number of nodes scanned in parallel per run.
  concurrent: 3

  # Priority applied to all NodeScans: high | medium | low
  priority: low

  # Restrict to specific nodes. Leave empty to scan all nodes.
  # Example:
  #   nodeSelector:
  #     matchLabels:
  #       node-role.kubernetes.io/worker: ""
  nodeSelector: {}

  # Scan strategy for each NodeScan: full | incremental | smart
  # - full:        scan every file on every run (safest, slowest)
  # - incremental: scan only files modified since the last scan
  # - smart:       full scan every fullScanInterval runs, incremental in between
  # Leave empty to inherit the operator-level SCANNER_SCAN_STRATEGY env var.
  strategy: ""

  # Incremental scan configuration (only used when strategy is incremental or smart).
  incrementalConfig:
    # How often to force a full scan when strategy=smart (every N incremental scans).
    baselineInterval: 7
    # Maximum file age (hours) to consider for incremental scans.
    # Must be greater than your scan interval — e.g. 168 for daily scans (7 days).
    maxAge: 168
    # Skip files whose mtime+size have not changed since the last scan.
    skipUnchangedFiles: true

  # Number of successful ClusterScan objects to retain in history.
  successfulScansHistoryLimit: 3

  # Number of failed ClusterScan objects to retain in history.
  # Aligned with the CRD default (+kubebuilder:default=3).
  failedScansHistoryLimit: 3

  # Maximum delay (seconds) before skipping a missed scheduled run.
  # Useful after a cluster outage. Unset by default.
  # startingDeadlineSeconds: 3600

# =============================================================================
# NETWORK POLICIES
# =============================================================================
networkPolicy:
  # Enable network policies (recommended for production — enabled by default)
  enabled: true
  policyTypes:
    - Ingress
    - Egress

  # CIDR of the Kubernetes API server / control-plane nodes.
  # The API server is a process on control-plane nodes — not a pod.
  # namespaceSelector has no effect on this traffic; ipBlock is required.
  # "0.0.0.0/0" allows all sources. For tighter security set this to your
  # actual control-plane CIDR (e.g. "10.0.0.10/32" or "10.0.0.0/24").
  # This CIDR is used for:
  #   - egress to the Kubernetes API server (startup checks, CRD operations)
  #   - ingress from the API server to the webhook port (admission / conversion)
  controlPlaneCIDR: "0.0.0.0/0"

  # Port the Kubernetes API server listens on.
  # Standard: 6443. Some managed clusters (AKS, GKE) expose it on 443.
  apiServerPort: 6443

  # CIDR of cluster worker nodes.
  # Kubelet liveness/readiness/startup probes are sent from the node IP,
  # not from a namespace-matched pod. namespaceSelector cannot capture them.
  # "0.0.0.0/0" allows all. Tighten to your node subnet in production.
  nodesCIDR: "0.0.0.0/0"

  # Additional ingress rules appended to the auto-generated kubelet-probe and
  # webhook rules. Empty by default — add your own rules as needed.
  # The kubelet probe and webhook ingress rules are generated automatically
  # from nodesCIDR / controlPlaneCIDR above — do not duplicate them here.
  #
  # Example — allow Prometheus scrape from a monitoring namespace:
  # ingress:
  #   - from:
  #     - namespaceSelector:
  #         matchLabels:
  #           kubernetes.io/metadata.name: monitoring
  #     ports:
  #     - protocol: TCP
  #       port: 8080
  ingress: []

  # Egress rules for the freshclam CronJob NetworkPolicy.
  # Only rendered when scanner.mode=standalone AND scanner.freshclam.enabled=true.
  # Default: allow HTTPS to ClamAV mirrors and DNS via CoreDNS.
  # Override to restrict to your internal mirror or proxy.
  freshclamEgress:
    # HTTPS to ClamAV update mirrors (database.clamav.net)
    - ports:
      - protocol: TCP
        port: 443
      - protocol: TCP
        port: 80
    # DNS — UDP for standard queries, TCP for large responses / DNSSEC
    - to:
      - namespaceSelector:
          matchLabels:
            kubernetes.io/metadata.name: kube-system
      ports:
      - protocol: UDP
        port: 53
      - protocol: TCP
        port: 53

  # Additional egress rules for the operator pod, appended to the
  # auto-generated API-server rule.
  # Default: DNS only — required for the operator to resolve service names.
  # The API server egress rule is generated automatically from controlPlaneCIDR
  # above — do not duplicate it here.
  # Add rules for remote-mode ClamAV, notifications (SMTP, Slack webhook), etc.
  egress:
    # DNS — required for service name resolution inside the cluster
    - to:
      - namespaceSelector:
          matchLabels:
            kubernetes.io/metadata.name: kube-system
      ports:
      - protocol: UDP
        port: 53
      - protocol: TCP
        port: 53
  # Example — remote-mode ClamAV daemon (uncomment and add to egress list above):
  # - to:
  #   - namespaceSelector:
  #       matchLabels:
  #         kubernetes.io/metadata.name: clamav
  #   ports:
  #   - protocol: TCP
  #     port: 3310

# =============================================================================
# ADDITIONAL CONFIGURATION
# =============================================================================

# Additional environment variables for the operator
env: []
# Development example:
# - name: LOG_LEVEL
#   value: "debug"

# Additional volumes
volumes: []

# Additional volume mounts
volumeMounts: []
