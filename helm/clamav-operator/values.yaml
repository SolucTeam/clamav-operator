# Default values for clamav-operator.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.
#
# Environment-specific configurations:
# - Development: Use lower resources, disable HA features
# - Production: Use higher resources, enable HA and monitoring
#
# To customize for your environment, override these values with:
#   helm install clamav-operator ./helm/clamav-operator -f custom-values.yaml

# =============================================================================
# OPERATOR CONFIGURATION
# =============================================================================
operator:
  # Number of operator replicas
  # Development: 1, Production: 2 (for HA)
  replicaCount: 1

  image:
    # Image repository - update for your private registry
    repository: ghcr.io/solucteam/clamav-operator
    pullPolicy: IfNotPresent
    # Overrides the image tag whose default is the chart appVersion.
    # Development: "latest", Production: specific version like "v1.0.0"
    tag: ""

  # Image pull secrets for private registries
  imagePullSecrets: []
  # - name: regcred

  nameOverride: ""
  fullnameOverride: ""

  serviceAccount:
    # Specifies whether a service account should be created
    create: true
    # Automatically mount a ServiceAccount's API credentials?
    automount: true
    # Annotations to add to the service account
    annotations: {}
    # The name of the service account to use.
    # If not set and create is true, a name is generated using the fullname template
    name: ""

  podAnnotations: {}
  podLabels: {}

  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 65532
    runAsGroup: 65532
    fsGroup: 65532

  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
      - ALL
    readOnlyRootFilesystem: true
    runAsNonRoot: true
    runAsUser: 65532

  # Service for metrics and health
  service:
    type: ClusterIP
    port: 8080
    metricsPort: 8080
    healthPort: 8081

  # Resource limits and requests
  # Development:
  #   limits: { cpu: 500m, memory: 256Mi }
  #   requests: { cpu: 100m, memory: 128Mi }
  # Production:
  #   limits: { cpu: 1000m, memory: 512Mi }
  #   requests: { cpu: 200m, memory: 256Mi }
  resources:
    limits:
      cpu: 500m
      memory: 256Mi
    requests:
      cpu: 100m
      memory: 128Mi

  # Leader election settings
  leaderElection:
    # Disable in development for simpler debugging
    enabled: true
    leaseDuration: 15s
    renewDeadline: 10s
    retryPeriod: 2s

  # Node selector for operator pod
  nodeSelector: {}

  tolerations: []

  # Pod anti-affinity for HA (recommended for production)
  # Production example:
  #   podAntiAffinity:
  #     preferredDuringSchedulingIgnoredDuringExecution:
  #     - weight: 100
  #       podAffinityTerm:
  #         labelSelector:
  #           matchExpressions:
  #           - key: app.kubernetes.io/name
  #             operator: In
  #             values:
  #             - clamav-operator
  #         topologyKey: kubernetes.io/hostname
  affinity: {}

  # Priority class name for production: system-cluster-critical
  priorityClassName: ""

# =============================================================================
# SCANNER CONFIGURATION
# =============================================================================
scanner:
  image:
    repository: ghcr.io/solucteam/clamav-node-scanner
    # Defaults to Chart.AppVersion when empty — keeps operator and scanner in sync.
    # Override for a specific scanner version: tag: "v0.2.0"
    tag: ""
    pullPolicy: IfNotPresent

  # Scan mode: "standalone" or "remote"
  # - standalone: clamscan binary + signatures embedded in the scanner image.
  #   Zero network dependency, each node scans locally.
  # - remote: connects to a central clamd service (legacy behaviour).
  mode: standalone

  # ClamAV remote service configuration (used only when mode=remote)
  clamav:
    host: clamav.clamav.svc.cluster.local
    port: 3310

  # Standalone-mode binary paths (override if your image differs)
  standalone:
    clamscanPath: /usr/bin/clamscan
    clamavDbPath: /var/lib/clamav

  # ---------------------------------------------------------------------------
  # Freshclam – ClamAV signature updates
  # ---------------------------------------------------------------------------
  freshclam:
    # Enable automatic signature updates via freshclam CronJob.
    # Set to false for air-gapped environments where signatures are
    # pre-loaded into the scanner image at build time.
    enabled: true
    # Cron schedule – default every 6 hours
    schedule: "0 */6 * * *"
    image:
      repository: clamav/clamav
      tag: "1.3"
      pullPolicy: IfNotPresent
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 256Mi

  # ---------------------------------------------------------------------------
  # Signature persistence
  # NOTE: this setting is only meaningful when mode=remote AND freshclam.enabled=true.
  # In standalone mode, signatures are baked into the scanner image at build time;
  # this PVC would be mounted but never written to by the scanner container.
  # ---------------------------------------------------------------------------
  signatures:
    # Use a PersistentVolumeClaim to share signatures between the freshclam CronJob
    # and the remote-mode clamd daemon across restarts.
    # When false an emptyDir is used — signatures are re-downloaded on every
    # freshclam run or must be baked into the image for air-gap environments.
    persistent: false
    pvcName: clamav-signatures
    storageClass: ""
    accessMode: ReadWriteOnce
    size: 1Gi

  # ---------------------------------------------------------------------------
  # Incremental scan settings
  # ---------------------------------------------------------------------------
  incremental:
    enabled: true
    # Strategy: "full" | "incremental" | "smart"
    # - full: scan every file every time
    # - incremental: only scan new/modified files since last run
    # - smart: full scan periodically, incremental in between
    strategy: smart
    # For smart strategy: run a full scan every N incremental scans
    fullScanInterval: 10
    # Maximum file age in hours to consider for incremental scans
    maxFileAgeHours: 24
    # Skip files whose mtime+size haven't changed since last scan
    skipUnchangedFiles: true

  # ServiceAccount for scanner jobs
  serviceAccount:
    create: true
    name: clamav-scanner
    annotations: {}

  # Default resources for scanner jobs
  # Development:
  #   requests: { cpu: 200m, memory: 256Mi }
  #   limits: { cpu: 1000m, memory: 512Mi }
  # Production:
  #   requests: { cpu: 1000m, memory: 1Gi }
  #   limits: { cpu: 4000m, memory: 2Gi }
  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: 2000m
      memory: 1Gi

  # Image pull secrets for scanner jobs
  imagePullSecrets: []
  # - name: regcred

# =============================================================================
# CUSTOM RESOURCE DEFINITIONS
# =============================================================================
# CRDs are placed in the Helm-native crds/ directory (chart root) and are
# always installed/upgraded by Helm before chart resources.
# The "helm.sh/resource-policy: keep" annotation is baked into each CRD,
# so they are retained on `helm uninstall` to protect existing scan data.
# (These values are kept for backward compatibility but have no effect.)
crds:
  install: true
  keep: true

# =============================================================================
# RBAC CONFIGURATION
# =============================================================================
rbac:
  # Create RBAC resources
  create: true

  # ClusterRole rules for the operator
  clusterRoleRules:
    - apiGroups:
        - ""
      resources:
        - nodes
      verbs:
        - get
        - list
        - watch
    # Required by startup_checks.go: checkAPIServerConnectivity calls Namespaces().List()
    - apiGroups:
        - ""
      resources:
        - namespaces
      verbs:
        - get
        - list
        - watch
    # Required by startup_checks.go: checkScannerServiceAccount calls ServiceAccounts(ns).Get()
    - apiGroups:
        - ""
      resources:
        - serviceaccounts
      verbs:
        - get
        - list
        - watch
    - apiGroups:
        - ""
      resources:
        - events
      verbs:
        - create
        - patch
    - apiGroups:
        - ""
      resources:
        - pods
        - pods/log
      verbs:
        - get
        - list
    - apiGroups:
        - ""
      resources:
        - services
        - endpoints
      verbs:
        - get
        - list
    - apiGroups:
        - batch
      resources:
        - jobs
      verbs:
        - create
        - get
        - list
        - watch
        - update
        - patch
        - delete
    - apiGroups:
        - clamav.io
      resources:
        - nodescans
        - clusterscans
        - scanpolicies
        - scanschedules
        - scancacheresources
      verbs:
        - create
        - delete
        - get
        - list
        - patch
        - update
        - watch
    - apiGroups:
        - clamav.io
      resources:
        - nodescans/finalizers
        - clusterscans/finalizers
        - scanpolicies/finalizers
        - scanschedules/finalizers
        - scancacheresources/finalizers
      verbs:
        - update
    - apiGroups:
        - clamav.io
      resources:
        - nodescans/status
        - clusterscans/status
        - scanpolicies/status
        - scanschedules/status
        - scancacheresources/status
      verbs:
        - get
        - patch
        - update

# =============================================================================
# CRD PATCHER HOOK
# =============================================================================
# Post-install/post-upgrade Job that patches the three CRDs (NodeScan,
# ClusterScan, ScanSchedule) with conversion.strategy: Webhook.
# Only runs when webhook.enabled=true.
crdPatcher:
  image:
    # registry.k8s.io/kubectl is the official, Google-maintained kubectl image.
    # Pin the tag to the minor version of your cluster (e.g. "1.29", "1.30").
    # Any image that provides a kubectl binary at /usr/bin/kubectl works.
    repository: registry.k8s.io/kubectl
    tag: "1.29"
    pullPolicy: IfNotPresent

  # Pull secrets for the patcher Job pods (air-gap / private registry).
  # Format: list of {name: <secret>} — same structure as pod.spec.imagePullSecrets.
  imagePullSecrets: []
  # Example:
  #   imagePullSecrets:
  #     - name: regcred

# =============================================================================
# WEBHOOK CONFIGURATION
# =============================================================================
webhook:
  enabled: true
  port: 9443

  # Certificate management
  # STRONGLY RECOMMENDED for production: set certManager.enabled=true.
  # cert-manager handles automatic rotation and survives pod restarts.
  certManager:
    enabled: false

  # If certManager is disabled, use these certificates.
  # WARNING: autoGenerate=true produces self-signed certs stored in a Secret.
  # These certs are NOT rotated automatically and do NOT survive Secret deletion
  # or namespace recreation. For production, use certManager.enabled=true or
  # supply your own long-lived certs via caBundle/tlsCert/tlsKey.
  certificates:
    # Auto-generate self-signed certificates (development only)
    autoGenerate: true
    # Or provide your own
    caBundle: ""
    tlsCert: ""
    tlsKey: ""

# =============================================================================
# MONITORING CONFIGURATION
# =============================================================================
monitoring:
  # Enable ServiceMonitor for Prometheus Operator
  serviceMonitor:
    # Development: false, Production: true
    enabled: false
    # Prometheus instance selector
    selector:
      prometheus: kube-prometheus
    # Scrape interval (Production: 60s)
    interval: 30s
    # Scrape timeout
    scrapeTimeout: 30s
    # Additional labels
    labels: {}
    # Honor labels
    honorLabels: false

  # Enable PrometheusRule for alerts
  prometheusRule:
    # Development: false, Production: true
    enabled: false
    # Additional labels
    labels: {}
    # Alert rules
    rules:
      - alert: ClamAVMalwareDetected
        expr: increase(clamav_files_infected_total[5m]) > 0
        for: 1m
        labels:
          severity: critical
          team: security
        annotations:
          summary: "Malware detected on node {{ $labels.node }}"
          description: "{{ $value }} infected files detected"

      - alert: ClamAVScanFailed
        expr: increase(clamav_nodescans_total{status="Failed"}[5m]) > 0
        for: 5m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "ClamAV scan failed"
          description: "{{ $value }} scans have failed in the last 5 minutes"

      - alert: ClamAVNoRecentScans
        expr: time() - clamav_nodescan_last_completion_timestamp > 86400
        for: 1h
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "No recent ClamAV scans"
          description: "No scans completed in the last 24 hours"

# =============================================================================
# DEFAULT SCAN POLICY
# =============================================================================
defaultScanPolicy:
  # Create a default ScanPolicy resource
  enabled: true
  name: default-policy
  spec:
    # Paths to scan
    paths:
      - /var/lib
      - /opt
      - /usr/local

    # Exclude patterns
    excludePatterns:
      - "*.tmp"
      - "*.log"
      - "/var/lib/docker/overlay2/*"
      - "/var/lib/containerd/*"

    # Maximum concurrent file scans per node.
    # Reduced to 3 (from 5) to limit CPU pressure on busy nodes.
    # Tune upward only on dedicated scanning nodes.
    maxConcurrent: 3

    # File timeout in milliseconds
    fileTimeout: 300000

    # Maximum file size to scan in bytes (500MB)
    # Development: 104857600 (100MB), Production: 1073741824 (1GB)
    maxFileSize: 524288000

    # Resources for scan jobs
    resources:
      requests:
        cpu: 500m
        memory: 512Mi
      limits:
        cpu: 2000m
        memory: 1Gi

    # Notifications (configure for production)
    # notifications:
    #   slack:
    #     enabled: true
    #     webhookSecretRef:
    #       name: slack-webhook-secret
    #       key: url
    #     channel: "#security-alerts"
    #     onlyOnInfection: true
    #   email:
    #     enabled: true
    #     smtpServer: smtp.example.com:587
    #     smtpAuthSecretRef:
    #       name: smtp-credentials
    #     from: clamav@example.com
    #     recipients:
    #       - security@example.com
    #     onlyOnInfection: true

# =============================================================================
# NETWORK POLICIES
# =============================================================================
networkPolicy:
  # Enable network policies (recommended for production — enabled by default)
  enabled: true
  policyTypes:
    - Ingress
    - Egress

  # CIDR of the Kubernetes API server / control-plane nodes.
  # The API server is a process on control-plane nodes — not a pod.
  # namespaceSelector has no effect on this traffic; ipBlock is required.
  # "0.0.0.0/0" allows all sources. For tighter security set this to your
  # actual control-plane CIDR (e.g. "10.0.0.10/32" or "10.0.0.0/24").
  # This CIDR is used for:
  #   - egress to the Kubernetes API server (startup checks, CRD operations)
  #   - ingress from the API server to the webhook port (admission / conversion)
  controlPlaneCIDR: "0.0.0.0/0"

  # Port the Kubernetes API server listens on.
  # Standard: 6443. Some managed clusters (AKS, GKE) expose it on 443.
  apiServerPort: 6443

  # CIDR of cluster worker nodes.
  # Kubelet liveness/readiness/startup probes are sent from the node IP,
  # not from a namespace-matched pod. namespaceSelector cannot capture them.
  # "0.0.0.0/0" allows all. Tighten to your node subnet in production.
  nodesCIDR: "0.0.0.0/0"

  # Additional ingress rules (e.g. Prometheus scrape).
  # The kubelet probe and webhook ingress rules are generated automatically
  # from nodesCIDR / controlPlaneCIDR above — do not duplicate them here.
  ingress:
    - from:
      - namespaceSelector:
          matchLabels:
            name: monitoring
      ports:
      - protocol: TCP
        port: 8080

  # Additional egress rules (ClamAV, DNS, …).
  # The API server egress rule is generated automatically from controlPlaneCIDR
  # above — do not duplicate it here.
  egress:
    # ClamAV service
    - to:
      - namespaceSelector:
          matchLabels:
            kubernetes.io/metadata.name: clamav
      ports:
      - protocol: TCP
        port: 3310
    # DNS — UDP for standard queries, TCP for large responses (> 512 B),
    # DNSSEC, and zone transfers. Both protocols must be allowed.
    - to:
      - namespaceSelector:
          matchLabels:
            kubernetes.io/metadata.name: kube-system
      ports:
      - protocol: UDP
        port: 53
      - protocol: TCP
        port: 53

# =============================================================================
# ADDITIONAL CONFIGURATION
# =============================================================================

# Additional environment variables for the operator
env: []
# Development example:
# - name: LOG_LEVEL
#   value: "debug"

# Additional volumes
volumes: []

# Additional volume mounts
volumeMounts: []
