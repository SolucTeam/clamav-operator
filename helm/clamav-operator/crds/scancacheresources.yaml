apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: scancacheresources.clamav.io
  annotations:
    "helm.sh/resource-policy": keep
    controller-gen.kubebuilder.io/version: v0.14.0
  labels:
    app.kubernetes.io/managed-by: Helm
spec:
  group: clamav.io
  names:
    kind: ScanCacheResource
    listKind: ScanCacheResourceList
    plural: scancacheresources
    shortNames:
    - sc
    - scancache
    singular: scancacheresource
  scope: Namespaced
  versions:
  - name: v1alpha1
    schema:
      openAPIV3Schema:
        description: ScanCacheResource stores the per-node scan cache
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: ScanCache holds the scan cache for a node
            properties:
              cacheVersion:
                description: CacheVersion is the cache format version (for future migrations)
                type: string
              files:
                description: |-
                  Files contains the metadata of scanned files.
                  Capped at 10 000 entries to keep the CustomResource size manageable
                items:
                  description: FileMetadata holds the metadata of a scanned file
                  properties:
                    hash:
                      description: Hash is the SHA256 hash of the file (optional)
                      type: string
                    lastScanned:
                      description: LastScanned is the Unix timestamp of the last scan
                      format: int64
                      type: integer
                    modTime:
                      description: ModTime is the Unix modification timestamp
                      format: int64
                      type: integer
                    path:
                      description: Path is the absolute path to the file
                      type: string
                    scanResult:
                      description: 'ScanResult is the outcome of the last scan: "clean" or "infected"'
                      type: string
                    size:
                      description: Size is the file size in bytes
                      format: int64
                      type: integer
                  required:
                  - lastScanned
                  - modTime
                  - path
                  - scanResult
                  - size
                  type: object
                type: array
              lastFullScan:
                description: LastFullScan is the Unix timestamp of the last full scan
                format: int64
                type: integer
              lastIncrementalScan:
                description: LastIncrementalScan is the Unix timestamp of the last incremental scan
                format: int64
                type: integer
              nodeName:
                description: NodeName is the name of the scanned node
                type: string
              scanCount:
                description: ScanCount is the number of scans performed since the last full scan
                format: int32
                type: integer
              totalFiles:
                description: TotalFiles is the total number of tracked files
                format: int64
                type: integer
            required:
            - cacheVersion
            - lastFullScan
            - nodeName
            - scanCount
            - totalFiles
            type: object
          status:
            description: ScanCacheStatus defines the observed state of the scan cache
            properties:
              compressed:
                description: Compressed indicates whether the cache data is compressed
                type: boolean
              lastUpdated:
                description: LastUpdated is the timestamp of the last cache update
                format: date-time
                type: string
              size:
                description: Size is the cache size in bytes
                format: int64
                type: integer
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
