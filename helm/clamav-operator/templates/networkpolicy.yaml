{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "clamav-operator.fullname" . }}-network-policy
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "clamav-operator.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "clamav-operator.selectorLabels" . | nindent 6 }}
      control-plane: controller-manager
  policyTypes:
    {{- toYaml .Values.networkPolicy.policyTypes | nindent 4 }}
  ingress:
    {{- with .Values.networkPolicy.ingress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    # Kubelet liveness/readiness/startup probes come from the node IP, not from
    # a pod namespace. A namespaceSelector cannot match them — ipBlock is required.
    # Restrict networkPolicy.nodesCIDR to your node subnet in production.
    - from:
      - ipBlock:
          cidr: {{ .Values.networkPolicy.nodesCIDR }}
      ports:
      - protocol: TCP
        port: {{ .Values.operator.service.healthPort }}
    {{- if .Values.webhook.enabled }}
    # Admission and conversion webhook calls originate from the API server process
    # running on control-plane nodes — not from a pod. ipBlock is required.
    # Restrict networkPolicy.controlPlaneCIDR to your control-plane subnet in production.
    - from:
      - ipBlock:
          cidr: {{ .Values.networkPolicy.controlPlaneCIDR }}
      ports:
      - protocol: TCP
        port: {{ .Values.webhook.port }}
    {{- end }}
  egress:
    # Kubernetes API server — runs as a process on control-plane nodes, not a pod.
    # namespaceSelector does not apply here; ipBlock is mandatory.
    # Restrict networkPolicy.controlPlaneCIDR to your control-plane subnet in production.
    - to:
      - ipBlock:
          cidr: {{ .Values.networkPolicy.controlPlaneCIDR }}
      ports:
      - protocol: TCP
        port: {{ .Values.networkPolicy.apiServerPort }}
    {{- with .Values.networkPolicy.egress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
---
{{- if and (eq $.Values.scanner.mode "standalone") $.Values.scanner.freshclam.enabled }}
# Network policy for freshclam CronJob pods — allow HTTPS egress to
# ClamAV signature mirrors and DNS resolution.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "clamav-operator.fullname" . }}-freshclam-egress
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "clamav-operator.labels" . | nindent 4 }}
    app.kubernetes.io/component: freshclam
spec:
  podSelector:
    matchLabels:
      {{- include "clamav-operator.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: freshclam
  {{- if .Values.networkPolicy.freshclamEgress }}
  policyTypes:
    - Egress
  egress:
    {{- toYaml .Values.networkPolicy.freshclamEgress | nindent 4 }}
  {{- end }}
{{- end }}
{{- end }}
