{{- /*
default-scanschedule.yaml

Creates the default ScanSchedule after the operator is confirmed Ready and
after the default ScanPolicy (weight 10) has been applied.

WHY THIS IS A HOOK (not a regular template)
  Same reason as default-scanpolicy.yaml: the ValidatingWebhookConfiguration
  routes ScanSchedule admission through the operator with failurePolicy: Fail.
  Applying this resource before the operator pod is Ready causes a webhook
  connection error and the resource creation fails.

  Hook weight 15 > ScanPolicy weight 10, so the ScanPolicy always exists
  before the ScanSchedule is created (ScanSchedule references scanPolicy).

UPGRADE BEHAVIOUR
  No "before-hook-creation" delete policy: Helm patches the existing resource
  in place on every helm upgrade, preserving live edits.
*/}}
{{- if .Values.defaultScanSchedule.enabled }}
apiVersion: clamav.io/v1alpha1
kind: ScanSchedule
metadata:
  name: {{ .Values.defaultScanSchedule.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "clamav-operator.labels" . | nindent 4 }}
    app.kubernetes.io/component: scan-schedule
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "15"
spec:
  {{- if .Values.defaultScanSchedule.schedule }}
  schedule: {{ .Values.defaultScanSchedule.schedule | quote }}
  {{- else }}
  {{- fail "defaultScanSchedule.schedule is required when defaultScanSchedule.enabled=true" }}
  {{- end }}
  {{- if kindIs "bool" .Values.defaultScanSchedule.suspend }}
  suspend: {{ .Values.defaultScanSchedule.suspend }}
  {{- end }}
  {{- if .Values.defaultScanSchedule.concurrencyPolicy }}
  concurrencyPolicy: {{ .Values.defaultScanSchedule.concurrencyPolicy }}
  {{- end }}
  {{- /* Always render integer limits — {{- if 0 }} is falsy and would silently
       ignore a user-supplied value of 0, falling back to the CRD default
       instead. Using a sentinel of -1 in values.yaml means "omit the field". */}}
  {{- if (ge (int .Values.defaultScanSchedule.successfulScansHistoryLimit) 0) }}
  successfulScansHistoryLimit: {{ .Values.defaultScanSchedule.successfulScansHistoryLimit }}
  {{- end }}
  {{- if (ge (int .Values.defaultScanSchedule.failedScansHistoryLimit) 0) }}
  failedScansHistoryLimit: {{ .Values.defaultScanSchedule.failedScansHistoryLimit }}
  {{- end }}
  {{- if .Values.defaultScanSchedule.startingDeadlineSeconds }}
  startingDeadlineSeconds: {{ .Values.defaultScanSchedule.startingDeadlineSeconds }}
  {{- end }}
  clusterScan:
    {{- if .Values.defaultScanSchedule.scanPolicy }}
    scanPolicy: {{ .Values.defaultScanSchedule.scanPolicy }}
    {{- end }}
    {{- if .Values.defaultScanSchedule.concurrent }}
    concurrent: {{ .Values.defaultScanSchedule.concurrent }}
    {{- end }}
    {{- if .Values.defaultScanSchedule.priority }}
    priority: {{ .Values.defaultScanSchedule.priority }}
    {{- end }}
    {{- with .Values.defaultScanSchedule.nodeSelector }}
    nodeSelector:
      {{- toYaml . | nindent 6 }}
    {{- end }}
{{- end }}
