{{- /*
webhook-tls.yaml — Certificate management for the admission webhook TLS.

Deux modes mutuellement exclusifs, pilotés par webhook.certManager.enabled :

MODE A — certManager.enabled=true (recommandé en production)
  SelfSigned Issuer
    → CA Certificate (isCA: true)
      → CA Issuer
        → Webhook Certificate  →  Secret "...-webhook-server-cert"  →  pod volume mount
                                                                         ↓
                                   cert-manager cainjector injecte le caBundle
                                   dans la ValidatingWebhookConfiguration
                                   via l'annotation cert-manager.io/inject-ca-from

MODE B — certManager.enabled=false : certificats fournis par l'opérateur
  Requis : webhook.certificates.{tlsCert,tlsKey,caBundle} (PEM / base64 du DER).
  Le Secret "...-webhook-server-cert" est rendu depuis ces valeurs.
  Sans ces trois valeurs le rendu ÉCHOUE explicitement (fail) : sans caBundle
  valide, la ValidatingWebhookConfiguration (failurePolicy: Fail) rejetterait
  tous les CREATE/UPDATE sur les CRDs et le pod ne pourrait pas démarrer
  (Secret de certificat absent du volume).
*/}}
{{- if and .Values.webhook.enabled .Values.webhook.certManager.enabled }}
---
# Step 1 — Issuer bootstrap : auto-signé, sert uniquement à émettre le CA.
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: {{ include "clamav-operator.fullname" . }}-selfsigned-issuer
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "clamav-operator.labels" . | nindent 4 }}
    app.kubernetes.io/component: webhook
spec:
  selfSigned: {}
---
# Step 2 — CA Certificate (isCA: true) émis par le SelfSigned Issuer.
# Le secret résultant contient tls.crt / tls.key / ca.crt que le CA Issuer consommera.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ include "clamav-operator.fullname" . }}-ca
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "clamav-operator.labels" . | nindent 4 }}
    app.kubernetes.io/component: webhook
spec:
  isCA: true
  commonName: {{ include "clamav-operator.fullname" . }}-ca
  secretName: {{ include "clamav-operator.fullname" . }}-ca
  duration: 87600h  # 10 ans — c'est un CA interne, renouvellement long acceptable
  renewBefore: 720h # 30 jours avant expiration
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    name: {{ include "clamav-operator.fullname" . }}-selfsigned-issuer
    kind: Issuer
    group: cert-manager.io
---
# Step 3 — CA Issuer : utilise le secret du CA Certificate pour signer les leaf certs.
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: {{ include "clamav-operator.fullname" . }}-ca-issuer
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "clamav-operator.labels" . | nindent 4 }}
    app.kubernetes.io/component: webhook
spec:
  ca:
    secretName: {{ include "clamav-operator.fullname" . }}-ca
---
# Step 4 — Webhook Certificate (leaf).
# secretName doit correspondre exactement au volume monté dans le pod :
#   {{ include "clamav-operator.fullname" . }}-webhook-server-cert
# Les SANs couvrent toutes les formes d'adresse que l'API server utilisera.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ include "clamav-operator.fullname" . }}-webhook-cert
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "clamav-operator.labels" . | nindent 4 }}
    app.kubernetes.io/component: webhook
spec:
  secretName: {{ include "clamav-operator.fullname" . }}-webhook-server-cert
  duration: 8760h   # 1 an
  renewBefore: 360h # 15 jours avant expiration
  subject:
    organizations:
      - {{ include "clamav-operator.fullname" . }}
  commonName: {{ include "clamav-operator.fullname" . }}-webhook-service
  dnsNames:
    - {{ include "clamav-operator.fullname" . }}-webhook-service
    - {{ include "clamav-operator.fullname" . }}-webhook-service.{{ .Release.Namespace }}
    - {{ include "clamav-operator.fullname" . }}-webhook-service.{{ .Release.Namespace }}.svc
    - {{ include "clamav-operator.fullname" . }}-webhook-service.{{ .Release.Namespace }}.svc.cluster.local
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always  # regénère la clé privée à chaque renouvellement
  issuerRef:
    name: {{ include "clamav-operator.fullname" . }}-ca-issuer
    kind: Issuer
    group: cert-manager.io
{{- else if and .Values.webhook.enabled (not .Values.webhook.certManager.enabled) }}
{{- $c := .Values.webhook.certificates }}
{{- if not (and $c.tlsCert $c.tlsKey $c.caBundle) }}
{{- fail (printf "webhook: certManager.enabled=false requires webhook.certificates.tlsCert, tlsKey AND caBundle (PEM) to be set. Without them the webhook Secret is never created (the operator pod cannot start) and the ValidatingWebhookConfiguration has an empty caBundle with failurePolicy=Fail, rejecting all CR writes. Either enable cert-manager, or generate certs with: openssl req -x509 -newkey ec -pkeyopt ec_paramgen_curve:prime256v1 -nodes -keyout tls.key -out tls.crt -days 3650 -subj '/CN=%s-webhook-service' -addext 'subjectAltName=DNS:%s-webhook-service,DNS:%s-webhook-service.%s,DNS:%s-webhook-service.%s.svc,DNS:%s-webhook-service.%s.svc.cluster.local'" (include "clamav-operator.fullname" .) (include "clamav-operator.fullname" .) (include "clamav-operator.fullname" .) .Release.Namespace (include "clamav-operator.fullname" .) .Release.Namespace (include "clamav-operator.fullname" .) .Release.Namespace) }}
{{- end }}
---
# Mode B — Secret TLS rendu depuis les valeurs fournies par l'opérateur du cluster.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "clamav-operator.fullname" . }}-webhook-server-cert
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "clamav-operator.labels" . | nindent 4 }}
    app.kubernetes.io/component: webhook
type: kubernetes.io/tls
data:
  tls.crt: {{ required "webhook.certificates.tlsCert is required (PEM)" $c.tlsCert | b64enc }}
  tls.key: {{ required "webhook.certificates.tlsKey is required (PEM)" $c.tlsKey | b64enc }}
{{- end }}
