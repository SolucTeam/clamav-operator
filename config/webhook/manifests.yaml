---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: validating-webhook-configuration
webhooks:
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: webhook-service
      namespace: system
      path: /validate-clamav-io-v1alpha1-clusterscan
  failurePolicy: Fail
  name: vclusterscan.kb.io
  rules:
  - apiGroups:
    - clamav.io
    apiVersions:
    - v1alpha1
    operations:
    - CREATE
    - UPDATE
    resources:
    - clusterscans
  sideEffects: None
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: webhook-service
      namespace: system
      path: /validate-clamav-io-v1alpha1-nodescan
  failurePolicy: Fail
  name: vnodescan.kb.io
  rules:
  - apiGroups:
    - clamav.io
    apiVersions:
    - v1alpha1
    operations:
    - CREATE
    - UPDATE
    resources:
    - nodescans
  sideEffects: None
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: webhook-service
      namespace: system
      path: /validate-clamav-io-v1alpha1-scanpolicy
  failurePolicy: Fail
  name: vscanpolicy.kb.io
  rules:
  - apiGroups:
    - clamav.io
    apiVersions:
    - v1alpha1
    operations:
    - CREATE
    - UPDATE
    resources:
    - scanpolicies
  sideEffects: None
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: webhook-service
      namespace: system
      path: /validate-clamav-io-v1alpha1-scanschedule
  failurePolicy: Fail
  name: vscanschedule.kb.io
  rules:
  - apiGroups:
    - clamav.io
    apiVersions:
    - v1alpha1
    operations:
    - CREATE
    - UPDATE
    resources:
    - scanschedules
  sideEffects: None
