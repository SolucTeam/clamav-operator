# Injecte le CA du webhook (via cert-manager cainjector) dans le caBundle de la
# ValidatingWebhookConfiguration. Requiert cert-manager (cainjector) dans le cluster.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: validating-webhook-configuration
  annotations:
    cert-manager.io/inject-ca-from: clamav-operator-system/clamav-operator-webhook-serving-cert
