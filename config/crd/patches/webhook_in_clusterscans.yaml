# Active le webhook de conversion v1alpha1 <-> v1beta1 pour les ClusterScans.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: clusterscans.clamav.io
  annotations:
    cert-manager.io/inject-ca-from: clamav-operator-system/clamav-operator-webhook-serving-cert
spec:
  conversion:
    strategy: Webhook
    webhook:
      conversionReviewVersions: ["v1"]
      clientConfig:
        service:
          name: webhook-service
          namespace: clamav-operator-system
          path: /convert
