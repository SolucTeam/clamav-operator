# Active le webhook de conversion v1alpha1 <-> v1beta1 pour les NodeScans.
# Sans ce patch (strategy: None), tous les champs v1alpha1 (incrementalConfig.*)
# sont silencieusement supprimés par l'API server (pruning par le schéma v1beta1).
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: nodescans.clamav.io
  annotations:
    cert-manager.io/inject-ca-from: clamav-operator-system/clamav-operator-webhook-serving-cert
spec:
  conversion:
    strategy: Webhook
    webhook:
      conversionReviewVersions: ["v1"]
      clientConfig:
        service:
          name: webhook-service
          namespace: clamav-operator-system
          path: /convert
