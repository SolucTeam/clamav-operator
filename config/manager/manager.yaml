apiVersion: v1
kind: Namespace
metadata:
  name: clamav-operator-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: clamav-operator
  namespace: clamav-operator-system
  labels:
    app.kubernetes.io/name: clamav-operator
    app.kubernetes.io/component: manager
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: clamav-operator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: clamav-operator
    spec:
      serviceAccountName: clamav-operator
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: manager
          image: ghcr.io/solucteam/clamav-operator:latest
          args:
            - --metrics-bind-address=:8080
            - --health-probe-bind-address=:8081
            - --leader-elect
          ports:
            - name: metrics
              containerPort: 8080
              protocol: TCP
            - name: health
              containerPort: 8081
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: clamav-operator
  namespace: clamav-operator-system
---
apiVersion: v1
kind: Service
metadata:
  name: clamav-operator-metrics
  namespace: clamav-operator-system
  labels:
    app.kubernetes.io/name: clamav-operator
spec:
  ports:
    - name: metrics
      port: 8080
      targetPort: metrics
  selector:
    app.kubernetes.io/name: clamav-operator
