apiVersion: v1
kind: Namespace
metadata:
  name: clamav-operator-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: clamav-operator
  namespace: clamav-operator-system
  labels:
    app.kubernetes.io/name: clamav-operator
    app.kubernetes.io/component: manager
spec:
  # 2 replicas (audit 2026-10): with the ValidatingWebhookConfiguration using
  # failurePolicy=Fail, a single replica means a node drain of the operator
  # pod blocks all NodeScan/ClusterScan/ScanPolicy/ScanSchedule writes
  # cluster-wide until rescheduling. Leader election keeps reconciliation
  # single-active; the standby serves the webhook.
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: clamav-operator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: clamav-operator
    spec:
      serviceAccountName: clamav-operator
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: manager
          # Kubebuilder placeholder: 'make dist' / 'make deploy' rewrite it via
          # `kustomize edit set image controller=${IMG}` (Makefile). Keep the
          # name 'controller' — a hardcoded image here makes that sed a no-op
          # and release artifacts shipped :latest (audit 2026-10).
          image: controller:latest
          args:
            - --metrics-bind-address=:8080
            - --health-probe-bind-address=:8081
            - --leader-elect
          ports:
            - name: metrics
              containerPort: 8080
              protocol: TCP
            - name: health
              containerPort: 8081
              protocol: TCP
            - name: webhook
              containerPort: 9443
              protocol: TCP
          volumeMounts:
            - name: webhook-cert
              mountPath: /tmp/k8s-webhook-server/serving-certs
              readOnly: true
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
      volumes:
        - name: webhook-cert
          secret:
            secretName: clamav-operator-webhook-server-cert
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: clamav-operator
  namespace: clamav-operator-system
---
apiVersion: v1
kind: Service
metadata:
  name: clamav-operator-metrics
  namespace: clamav-operator-system
  labels:
    app.kubernetes.io/name: clamav-operator
spec:
  ports:
    - name: metrics
      port: 8080
      targetPort: metrics
  selector:
    app.kubernetes.io/name: clamav-operator
