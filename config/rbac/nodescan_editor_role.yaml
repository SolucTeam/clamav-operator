# ClusterRole granting full write access to NodeScan objects.
# Bind this role to DevOps teams that manage scans manually.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: nodescan-editor-role
  labels:
    app.kubernetes.io/name: clamav-operator
    app.kubernetes.io/component: rbac
rules:
- apiGroups: ["clamav.io"]
  resources: ["nodescans"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: ["clamav.io"]
  resources: ["nodescans/status"]
  verbs: ["get"]
